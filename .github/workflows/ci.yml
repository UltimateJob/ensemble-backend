name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 逻辑层：快，每次 push 都跑
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："; echo "$unformatted"; exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 测试（含竞态检测）
        run: go test ./... -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out

      - name: 覆盖率
        run: go tool cover -func=coverage.out | tail -1

      - name: 构建
        run: go build -o bin/ensemble ./cmd/server

      - name: 冒烟
        run: |
          bin/ensemble & sleep 2
          curl -sf localhost:8080/healthz | grep -q '"status":"ok"'
          curl -sf -o /dev/null -w '%{http_code}' localhost:8080/app/   | grep -q 200
          curl -sf -o /dev/null -w '%{http_code}' localhost:8080/admin/ | grep -q 200
          echo "冒烟通过"
          kill %1

  # 浏览器端到端：真开一个 Chromium 跑完整流程
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Chromium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 构建并以 mock 上游启动
        run: |
          go build -o bin/ensemble ./cmd/server
          DEEPSEEK_API_KEY= bin/ensemble > server.log 2>&1 &
          sleep 3
          curl -sf localhost:8080/healthz

      - name: 端到端 · 桌面
        run: EDGE_PATH="$(which chrome)" node scripts/e2e.mjs

      - name: 端到端 · 移动端 390
        run: EDGE_PATH="$(which chrome)" node scripts/e2e-mobile.mjs

      - name: 失败时打印后端日志
        if: failure()
        run: cat server.log
