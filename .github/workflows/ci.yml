name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 测试（含竞态检测）
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: 覆盖率
        run: go tool cover -func=coverage.out | tail -1

      - name: 构建
        run: go build -o /tmp/ensemble ./cmd/server

      - name: 冒烟测试
        run: |
          /tmp/ensemble &
          sleep 2
          curl -sf localhost:8080/healthz | grep -q '"status":"ok"'
          curl -sf -o /dev/null -w '%{http_code}' localhost:8080/app/ | grep -q 200
          curl -sf -o /dev/null -w '%{http_code}' localhost:8080/admin/ | grep -q 200
          echo "冒烟通过"
          kill %1
